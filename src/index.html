<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jalo Moster</title>
    <meta property="og:title" content="Jalo Moster" />
    <meta
      property="og:description"
      content="Personal site of Jalo Moster — Software Engineer at Chick-fil-A."
    />
    <meta name="theme-color" content="#fafafa" />
    <link rel="stylesheet" href="./styles/globals.css" />
    <script>
      (() => {
        var c, d, meta;
        try {
          c = localStorage.getItem("theme") || "system";
          d =
            c === "dark" ||
            (c === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", d);
          meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", d ? "#09090b" : "#fafafa");
        } catch (_e) {}
      })();
    </script>
    <script type="module" src="./main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
